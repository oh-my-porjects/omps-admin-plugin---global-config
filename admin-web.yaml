module: global-config
module_title: 全局配置
menus:
  - key: configs
    title: 配置项
    icon: setting
    roles: [admin, developer, operator]
    views: [config_list]
views:
  - key: config_list
    type: table
    title: 全局配置
    api: GET /api/global_config/config/list
    columns:
      - field: config_key
        title: 键
      - field: current_value
        title: 当前值
        render: json
      - field: default_value
        title: 默认值
        render: json
      - field: value_type
        title: 类型
      - field: module_name
        title: 所属模块
      - field: description
        title: 说明
      - field: updated_at
        title: 更新时间
        render: datetime
    actions:
      - key: edit
        type: row
        title: 修改
        api: POST /api/global_config/config/update
        fields:
          - field: config_key
            title: 配置键
            type: string
            hidden: true
            required: true
          - field: current_value
            title: 配置值
            type: json
            required: true
            placeholder: 根据值类型填写字符串、数字、布尔值或 JSON
      - key: reset_default
        type: row
        title: 恢复默认值
        api: POST /api/global_config/config/reset-default
        danger: true
        confirm: 恢复默认值会立即覆盖当前配置，请确认
        fields:
          - field: config_key
            title: 配置键
            type: string
            hidden: true
            required: true
roles:
  - code: admin
    title: 超级管理员
  - code: developer
    title: 开发者
  - code: operator
    title: 运维
