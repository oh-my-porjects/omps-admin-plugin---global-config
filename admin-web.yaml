module: global-config
module_title: 全局配置
menus:
  - key: configs
    title: 配置项
    icon: setting
    roles: [admin, developer, operator]
    views: [config_list]
views:
  - key: config_list
    type: table
    title: 全局配置
    api: GET /api/global-config/list
    columns:
      - field: key
        title: 键
      - field: value
        title: 值
      - field: scope
        title: 作用域
      - field: updated_at
        title: 更新时间
        render: datetime
    actions:
      - key: create
        type: page
        title: 新增配置
        api: POST /api/global-config/set
      - key: edit
        type: row
        title: 修改
        api: PUT /api/global-config/{key}
      - key: delete
        type: row
        title: 删除
        api: DELETE /api/global-config/{key}
        danger: true
roles:
  - code: admin
    title: 超级管理员
  - code: developer
    title: 开发者
  - code: operator
    title: 运维
